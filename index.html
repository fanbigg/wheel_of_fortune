<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wheel of Fortune</title>
  <meta name="description" content="A random name picker wheel. Runs entirely in your browser.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="macos-window">

    <div class="title-bar">
      <div class="traffic-lights">
        <span class="dot dot-close"></span>
        <span class="dot dot-minimize"></span>
        <span class="dot dot-zoom"></span>
      </div>
      <span class="window-title">Wheel of Fortune</span>
      <div class="title-bar-actions">
        <button id="btn-sidebar-toggle" type="button" class="icon-btn"
                aria-expanded="true" aria-controls="sidebar-body" aria-label="Toggle names panel"></button>
      </div>
    </div>

    <div class="split">

      <!-- Names / settings sidebar -->
      <aside class="sidebar" id="sidebar-panel">
        <div class="sidebar-body" id="sidebar-body">

          <div class="form-group names-group">
            <label for="names-input">NAMES &#183; ONE PER LINE</label>
            <textarea id="names-input" autocomplete="off" autocapitalize="words" spellcheck="false"
                      placeholder="Enter names here...&#10;e.g.,&#10;Alice&#10;Bob&#10;Charlie"></textarea>
            <span class="hint" id="names-count" aria-live="polite"></span>
          </div>

          <div class="button-row">
            <button id="btn-shuffle" type="button" class="btn btn-secondary" title="Shuffle names">Shuffle</button>
            <button id="btn-clear" type="button" class="btn btn-secondary" title="Clear all names">Clear</button>
            <button id="btn-sample" type="button" class="btn btn-secondary" title="Load sample names">Reset</button>
          </div>

          <div class="settings-group">
            <div class="setting-row">
              <label for="turbo-toggle" class="setting-label">Turbo Play</label>
              <label class="switch">
                <input type="checkbox" id="turbo-toggle">
                <span class="switch-track"></span>
              </label>
            </div>
            <div id="turbo-stepper-container" class="setting-row stepper-row hidden">
              <label class="setting-label" id="stepper-label">Winners to pick</label>
              <div class="stepper">
                <button id="btn-stepper-minus" class="btn-stepper" type="button" aria-label="Fewer winners">&#8722;</button>
                <span id="stepper-value" class="stepper-value" role="status" aria-live="polite" aria-labelledby="stepper-label">3</span>
                <button id="btn-stepper-plus" class="btn-stepper" type="button" aria-label="More winners">+</button>
              </div>
            </div>
          </div>

        </div>
      </aside>

      <!-- Wheel stage -->
      <main class="stage">
        <div class="wheel-outer">
          <div class="pointer-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="34" height="34">
              <polygon points="12,20 2,4 22,4" />
            </svg>
          </div>

          <div class="wheel-wrapper">
            <canvas id="wheel-canvas" role="img" aria-label="Prize wheel"></canvas>
            <button id="spin-button" type="button" class="spin-hub"><span>SPIN</span></button>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Winner dialog -->
  <div id="winner-modal" class="modal-overlay hidden">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="confetti-container" id="confetti-container" aria-hidden="true"></div>
      <p class="modal-eyebrow" id="modal-title">Winner</p>
      <div id="winner-name" class="modal-winner-name"></div>
      <div class="modal-actions">
        <button id="btn-keep-winner" type="button" class="btn btn-secondary">Keep Name &amp; Close</button>
        <button id="btn-remove-winner" type="button" class="btn btn-danger">Remove &amp; Spin Again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
